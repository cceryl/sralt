[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sralt"
version = "0.2.2"
description = "SRALT"
requires-python = "==3.12.13"

dependencies = [
    "torch==2.12.1",
    "torchvision",
    "torchaudio",
    "torch-geometric",
    "torch-scatter",
    "torch-sparse",

    "torchmetrics",
    "tensorboard",
    "nvidia-ml-py==12.*",
    "cuda-python==12.6.*",
    "vector-quantize-pytorch",

    "matplotlib",
    "seaborn",
    "pandas",
    "scikit-learn",

    "debugpy",
    "tqdm",
    "colorlog",
    "hydra-core",
    "openpyxl"
]

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
torchaudio = { index = "pytorch" }

torch-scatter = { index = "pyg" }
torch-sparse = { index = "pyg" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pyg"
url = "https://data.pyg.org/whl/torch-2.12.0+cu126.html"
format = "flat"
explicit = true

[tool.setuptools.packages.find]
where = ["."]
include = ["sralt*"]

[tool.setuptools.package-data]
"sralt.configs" = ["**/*.yaml"]
