name: MLP
revision: author-aligned-v1

attribute:
  _target_: sralt.attack.model.mlp.MLP
  dropout: 0.5
  leaky_relu_slope: 0.2
  pos_weight: 1.0

train:
  train_batch_size: 512
  val_batch_size: 2048
  negative_ratio: 1.0
  num_epochs: 50
  optimizer:
    _target_: sralt.attack.model.miner.SGDWithGradientClipping
    lr: 0.05
    momentum: 0.9
    weight_decay: 0.0
    grad_clip_norm: 5.0
  metrics:
    - _target_: torchmetrics.AUROC
      task: binary
    - _target_: torchmetrics.F1Score
      task: binary
    - _target_: sralt.utils.TPRatFPR
      target_fpr: 0.01
  early_stopping:
    _target_: sralt.utils.EarlyStopping
    patience: 5
    greater_is_better: True
    epsilon: 1e-5
