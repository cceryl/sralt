# Independent experimental variant; the original MLP/BCE configuration is intact.
defaults:
  - mlp
  - _self_

name: MLP_STABLE
revision: layernorm-weighted-v1

attribute:
  # Reuse MLP's two Linear -> LayerNorm -> LeakyReLU -> Dropout blocks.
  norm: layer
  pos_weight: 2.0

train:
  optimizer:
    lr: 0.01
  num_epochs: 150
  early_stopping:
    patience: 20
