name: RecOnlyAttack
revision: auc-only-v1-rec-count-balanced-tail-v2
attribute:
  _target_: sralt.attack.model.rec_only.RecOnlyAttack
  hidden_dim: 16
train:
  train_batch_size: 512
  val_batch_size: 2048
  negative_ratio: 1.0
  num_epochs: 50
  optimizer:
    _target_: sralt.utils.train.AdamWithGradientClipping
    lr: 0.001
    weight_decay: 0.0
    grad_clip_norm: 5.0
  # Checkpoint selection uses public-validation All AUC only.
  metrics:
    - _target_: torchmetrics.AUROC
      task: binary
  early_stopping:
    _target_: sralt.utils.EarlyStopping
    patience: 5
    greater_is_better: true
    epsilon: 1e-5
