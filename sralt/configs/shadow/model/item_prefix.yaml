name: ItemPrefixShadow
revision: item-prefix-joint-library-v3
attribute:
  _target_: sralt.shadow.model.item_prefix.ItemPrefixShadow
  embed_dim: 64
  num_layers: 2
  decay: 0.01
  num_quantizers: 8
  codebook_size: 256
  levels: [8]
  rvq_max_iter: 50
  semantic_augmentation: true
  frequency_weighting: true
  proxy_kind: rvq
  prefix_edge_scale: 0.1
  rvq_training: end_to_end
  rvq_ema_update: false
  rvq_commitment_weight: 0.25
  rvq_ema_decay: 0.8
train:
  seed: ${seed}
  deterministic: ${deterministic}
  train_batch_size: 8192
  val_batch_size: 2048
  val_num_negatives: 999
  num_epochs: 100
  optimizer:
    _target_: torch.optim.Adam
    lr: 0.01
  metrics:
    - _target_: torch_geometric.metrics.LinkPredRecall
      k: 10
    - _target_: torch_geometric.metrics.LinkPredNDCG
      k: 10
  early_stopping:
    _target_: sralt.utils.EarlyStopping
    patience: 10
    greater_is_better: true
    epsilon: 1e-5
