defaults:
  - tail_proxy
  - _self_

revision: tail-proxy-shadow-e10-v2
attribute:
  embed_dim: 64
  num_layers: 2
  decay: 0.01
train:
  num_epochs: 10
  train_batch_size: 8192
  val_batch_size: 2048
  val_num_negatives: 999
  optimizer:
    _target_: torch.optim.Adam
    lr: 0.01
  early_stopping:
    patience: 10
    greater_is_better: true
    epsilon: 1e-5
