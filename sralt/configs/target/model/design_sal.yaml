defaults:
  - design
  - _self_
  # Apply literal dataset defaults last, preserving existing model cache keys.
  - sal_weights@attribute.defense: ${target/data}

name: DESIGN_SAL
revision: sal-isolated-v2

attribute:
  _target_: sralt.target.model.design.DefendedDESIGN
  _recursive_: False
  defense:
    _target_: sralt.target.defense.SocialAdversarialLearning
    _recursive_: False
    loss_weight: 0.01
    sample_ratio: 1.0
    surrogate_warmup_epochs: 5
    surrogate_epochs: 3
    surrogate_batch_size: 256
    surrogate_grad_clip: 5.0
    optimizer:
      _target_: torch.optim.Adam
      lr: 0.01
