defaults:
  - design_smia
  - _self_

name: DESIGN_SMIA_SAL
revision: socialpp-design22-sal-v1

attribute:
  _target_: sralt.target.model.smia_design.DefendedSMIADESIGN
  _recursive_: False
  defense:
    _target_: sralt.target.defense.SocialAdversarialLearning
    _recursive_: False
    # pp_main.py overrides parser's .1 with pri_coefs=[.01], for both datasets.
    loss_weight: 0.01
    sample_ratio: 1.0
    surrogate_warmup_epochs: 5
    surrogate_epochs: 3
    surrogate_batch_size: 256
    surrogate_grad_clip: 5.0
    optimizer:
      _target_: torch.optim.Adam
      lr: 0.01
