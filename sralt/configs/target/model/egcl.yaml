name: EGCL
revision: author-aligned-v1

attribute:
  _target_: sralt.target.model.egcl.EGCL
  embed_dim: 64
  num_layers: 3
  embedding_reg: 2.0
  weight_reg: 60.0
  beta: 0.3
  contrastive_batch_size: 1024
  temperature: 0.05
  intra_reg: 1e-6
  inter_reg: 1e-8

train:
  train_batch_size: 8192  # Positive-edge chunks; one full-graph update per epoch.
  val_batch_size: 4096
  val_num_negatives: 999
  num_epochs: 300
  optimizer:
    _target_: torch.optim.Adam
    lr: 1e-2
  metrics:
    - _target_: torch_geometric.metrics.LinkPredRecall
      k: 10
    - _target_: torch_geometric.metrics.LinkPredNDCG
      k: 10
  early_stopping:
    _target_: sralt.utils.EarlyStopping
    patience: 50
    greater_is_better: True
    epsilon: 1e-5
