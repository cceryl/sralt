defaults:
  - gdmsr
  - _self_

name: GDMSR_SAL
revision: sal-objectives-v6

attribute:
  _target_: sralt.target.model.gdmsr.DefendedGDMSR
  _recursive_: False
  defense:
    _target_: sralt.target.defense.SocialAdversarialLearning
    _recursive_: False
    # User explicitly selected 0.03 (2026-10-27), distinct from the tested 0.3.
    loss_kind: moments
    pair_feature_mode: concat
    frozen_eval: false
    diagnostics:
      enabled: false
      run_id: null
      every: 1
      pairs: 4096
      batch_size: 1024
      gradient_batches: 1
      seed: 1729
      holdout: none
      refit_epochs: 3
    loss_weight: 0.03
    sample_ratio: 1.0
    surrogate_warmup_epochs: 5
    surrogate_epochs: 3
    surrogate_refreshes: 1
    surrogate_batch_size: 256
    surrogate_grad_clip: 5.0
    optimizer:
      _target_: torch.optim.Adam
      lr: 0.01
